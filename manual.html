<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>지난 증상 입력</title>

    <link rel="stylesheet" href="./css/style.css">
</head>

<body>

<div class="app manual-page">

    <header class="page-header">
        <button
            type="button"
            class="back-button"
            onclick="location.href='index.html'"
        >
            ←
        </button>

        <div>
            <h1>지난 증상 입력</h1>
            <p>놓친 증상 기록을 직접 입력합니다.</p>
        </div>
    </header>


    <main>

        <!-- 발생 정보 -->
        <section class="form-card">

            <div class="form-card-title">
                <h2>발생 정보</h2>
                <span class="required-label">필수</span>
            </div>

            <div class="form-group">
                <label for="occurDate">발생 날짜</label>
                <input
                    type="date"
                    id="occurDate"
                >
            </div>

            <div class="form-group">
                <label for="startTime">발생 시간</label>
                <input
                    type="time"
                    id="startTime"
                    step="1"
                >
            </div>

            <div class="form-group">
                <label for="endTime">
                    종료 시간
                    <span class="optional-label">선택</span>
                </label>

                <input
                    type="time"
                    id="endTime"
                    step="1"
                >

                <p class="input-help">
                    종료 시간을 모르면 비워둘 수 있습니다.
                </p>
            </div>

            <div class="duration-preview">
                <span>지속시간</span>
                <strong id="durationPreview">미입력</strong>
            </div>

        </section>


        <!-- 증상 유형 -->
        <section class="form-card">

            <div class="form-card-title">
                <h2>증상 유형</h2>
                <span class="required-label">필수</span>
            </div>

            <div
                class="choice-grid"
                id="typeChoices"
            >

                <button
                    type="button"
                    class="choice-button"
                    data-value="전신 경련"
                >
                    전신 경련
                </button>

                <button
                    type="button"
                    class="choice-button"
                    data-value="의식 소실"
                >
                    의식 소실
                </button>

                <button
                    type="button"
                    class="choice-button"
                    data-value="멍함 / 반응 저하"
                >
                    멍함 / 반응 저하
                </button>

                <button
                    type="button"
                    class="choice-button"
                    data-value="부분 경련"
                >
                    부분 경련
                </button>

                <button
                    type="button"
                    class="choice-button"
                    data-value="기타"
                >
                    기타
                </button>

            </div>

        </section>


        <!-- 관찰 사항 -->
        <section class="form-card">

            <div class="form-card-title">
                <h2>관찰 사항</h2>
                <span class="optional-label">선택</span>
            </div>

            <div
                class="choice-grid"
                id="observationChoices"
            >

                <button
                    type="button"
                    class="choice-button"
                    data-value="넘어짐"
                >
                    넘어짐
                </button>

                <button
                    type="button"
                    class="choice-button"
                    data-value="호흡 이상"
                >
                    호흡 이상
                </button>

                <button
                    type="button"
                    class="choice-button"
                    data-value="침 흘림"
                >
                    침 흘림
                </button>

                <button
                    type="button"
                    class="choice-button"
                    data-value="구토"
                >
                    구토
                </button>

                <button
                    type="button"
                    class="choice-button"
                    data-value="특이사항 없음"
                >
                    특이사항 없음
                </button>

            </div>

        </section>


        <!-- 증상 후 상태 -->
        <section class="form-card">

            <div class="form-card-title">
                <h2>증상 후 상태</h2>
                <span class="optional-label">선택</span>
            </div>

            <div
                class="choice-grid"
                id="afterChoices"
            >

                <button
                    type="button"
                    class="choice-button"
                    data-value="바로 회복"
                >
                    바로 회복
                </button>

                <button
                    type="button"
                    class="choice-button"
                    data-value="졸림"
                >
                    졸림
                </button>

                <button
                    type="button"
                    class="choice-button"
                    data-value="혼란"
                >
                    혼란
                </button>

                <button
                    type="button"
                    class="choice-button"
                    data-value="평소와 다름"
                >
                    평소와 다름
                </button>

            </div>

        </section>


        <!-- 메모 -->
        <section class="form-card">

            <div class="form-card-title">
                <h2>메모</h2>
                <span class="optional-label">선택</span>
            </div>

            <textarea
                id="memo"
                rows="4"
                placeholder="기억나는 내용을 간단히 입력하세요."
            ></textarea>

        </section>


        <!-- 저장 -->
        <div class="manual-save-area">

            <button
                type="button"
                id="saveManualButton"
                class="save-button"
            >
                지난 증상 기록 저장
            </button>

        </div>

    </main>

</div>


<script type="module" src="./js/manual.js"></script>

</body>
</html>

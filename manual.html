
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>지난 증상 입력</title>

    <link rel="stylesheet" href="./css/style.css">
</head>

<body>

<div class="app manual-page">

    <header class="page-header">
        <button
            type="button"
            class="back-button"
            onclick="location.href='index.html'"
        >
            ←
        </button>

        <div>
            <h1>지난 증상 입력</h1>
            <p>놓친 증상 기록을 직접 입력합니다.</p>
        </div>
    </header>


    <main>

        <!-- 발생 정보 -->
        <section class="form-card">

            <div class="form-card-title">
                <h2>발생 정보</h2>
                <span class="required-label">필수</span>
            </div>

            <div class="form-group">
                <label for="occurDate">발생 날짜</label>
                <input
                    type="date"
                    id="occurDate"
                >
            </div>

            <div class="form-group">
                <label for="startTime">발생 시간</label>
                <input
                    type="time"
                    id="startTime"
                    step="1"
                >
            </div>

            <div class="form-group">
                <label for="endTime">
                    종료 시간
                    <span class="optional-label">선택</span>
                </label>

                <input
                    type="time"
                    id="endTime"
                    step="1"
                >

                <p class="input-help">
                    종료 시간을 모르면 비워둘 수 있습니다.
                </p>
            </div>

            <div class="duration-preview">
                <span>지속시간</span>
                <strong id="durationPreview">미입력</strong>
            </div>

        </section>


        <!-- 증상 유형 -->
        <section class="form-card">

            <div class="form-card-title">
                <h2>증상 유형</h2>
                <span class="required-label">필수</span>
            </div>

            <div
                class="choice-grid"
                id="typeChoices"
            >

                <button
                    type="button"
                    class="choice-button"
                    data-value="멍함 / 반응 저하"
                >
                    멍함 / 반응 저하
                </button>

                <button
                    type="button"
                    class="choice-button"
                    data-value="경직"
                >
                    경직
                </button>

                <button
                    type="button"
                    class="choice-button"
                    data-value="전신 경련"
                >
                    전신 경련
                </button>

                <button
                    type="button"
                    class="choice-button"
                    data-value="부분 경련"
                >
                    부분 경련
                </button>

                <button
                    type="button"
                    class="choice-button"
                    data-value="근육 움찔거림"
                >
                    근육 움찔거림
                </button>

                <button
                    type="button"
                    class="choice-button"
                    data-value="힘 빠짐"
                >
                    힘 빠짐
                </button>

                <button
                    type="button"
                    class="choice-button"
                    data-value="기타"
                >
                    기타
                </button>

            </div>

        </section>


        <!-- 관찰 사항 -->
        <section class="form-card">

            <div class="form-card-title">
                <h2>관찰 사항</h2>
                <span class="optional-label">선택</span>
            </div>

            <div
                class="choice-grid"
                id="observationChoices"
            >

                <button
                    type="button"
                    class="choice-button"
                    data-value="고개 떨굼"
                >
                    고개 떨굼
                </button>

                <button
                    type="button"
                    class="choice-button"
                    data-value="갑작스런 발성"
                >
                    갑작스런 발성
                </button>

                <button
                    type="button"
                    class="choice-button"
                    data-value="갑자기 주저앉음"
                >
                    갑자기 주저앉음
                </button>

                <button
                    type="button"
                    class="choice-button"
                    data-value="팔다리 떨림"
                >
                    팔다리 떨림
                </button>

                <button
                    type="button"
                    class="choice-button"
                    data-value="상체 처짐"
                >
                    상체 처짐
                </button>

                <button
                    type="button"
                    class="choice-button"
                    data-value="호흡 변화"
                >
                    호흡 변화
                </button>

                <button
                    type="button"
                    class="choice-button"
                    data-value="기타"
                >
                    기타
                </button>

            </div>

        </section>


        <!-- 발생 시점 -->
        <section class="form-card">

            <div class="form-card-title">
                <h2>발생 시점</h2>
                <span class="optional-label">선택</span>
            </div>

            <div
                class="choice-grid"
                id="occurrenceChoices"
            >

                <button
                    type="button"
                    class="choice-button"
                    data-value="섭취 중"
                >
                    섭취 중
                </button>

                <button
                    type="button"
                    class="choice-button"
                    data-value="활동 요청 중"
                >
                    활동 요청 중
                </button>

                <button
                    type="button"
                    class="choice-button"
                    data-value="서있는 중"
                >
                    서있는 중
                </button>

                <button
                    type="button"
                    class="choice-button"
                    data-value="보행 중"
                >
                    보행 중
                </button>

                <button
                    type="button"
                    class="choice-button"
                    data-value="휠체어 착석 활동 중"
                >
                    휠체어 착석 활동 중
                </button>

                <button
                    type="button"
                    class="choice-button"
                    data-value="휠체어 이동 중"
                >
                    휠체어 이동 중
                </button>

                <button
                    type="button"
                    class="choice-button"
                    data-value="위생활동 중"
                >
                    위생활동 중
                </button>

                <button
                    type="button"
                    class="choice-button"
                    data-value="전환/대기 중"
                >
                    전환/대기 중
                </button>

                <button
                    type="button"
                    class="choice-button"
                    data-value="외부활동 중"
                >
                    외부활동 중
                </button>

                <button
                    type="button"
                    class="choice-button"
                    data-value="기타"
                >
                    기타
                </button>

            </div>

        </section>


        <!-- 증상 후 상태 -->
        <section class="form-card">

            <div class="form-card-title">
                <h2>증상 후 상태</h2>
                <span class="optional-label">선택</span>
            </div>

            <div
                class="choice-grid"
                id="afterChoices"
            >

                <button
                    type="button"
                    class="choice-button"
                    data-value="즉시 회복"
                >
                    즉시 회복
                </button>

                <button
                    type="button"
                    class="choice-button"
                    data-value="소리내어 웃음"
                >
                    소리내어 웃음
                </button>

                <button
                    type="button"
                    class="choice-button"
                    data-value="의미없는 말하기"
                >
                    의미없는 말하기
                </button>

                <button
                    type="button"
                    class="choice-button"
                    data-value="침흘림 증가"
                >
                    침흘림 증가
                </button>

                <button
                    type="button"
                    class="choice-button"
                    data-value="배뇨"
                >
                    배뇨
                </button>

                <button
                    type="button"
                    class="choice-button"
                    data-value="졸림"
                >
                    졸림
                </button>

                <button
                    type="button"
                    class="choice-button"
                    data-value="기타"
                >
                    기타
                </button>

            </div>

        </section>


        <!-- 메모 -->
        <section class="form-card">

            <div class="form-card-title">
                <h2>메모</h2>
                <span class="optional-label">선택</span>
            </div>

            <textarea
                id="memo"
                rows="4"
                placeholder="기억나는 내용을 간단히 입력하세요."
            ></textarea>

        </section>


        <!-- 저장 -->
        <div class="manual-save-area">

            <button
                type="button"
                id="saveManualButton"
                class="save-button"
            >
                지난 증상 기록 저장
            </button>

        </div>

    </main>

</div>


<script type="module" src="./js/manual.js"></script>

</body>
</html>

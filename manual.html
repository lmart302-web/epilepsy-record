<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>지난 발작 입력</title>

    <link rel="stylesheet" href="./css/style.css">
</head>

<body>

<div class="app manual-page">

    <header class="page-header">
        <button
            type="button"
            class="back-button"
            onclick="location.href='index.html'"
        >
            ←
        </button>

        <div>
            <h1>지난 발작 입력</h1>
            <p>놓친 발작 기록을 직접 입력합니다.</p>
        </div>
    </header>


    <main>

        <!-- 발생 정보 -->
        <section class="form-card">

            <div class="form-card-title">
                <h2>발생 정보</h2>
                <span class="required-label">필수</span>
            </div>

            <div class="form-group">
                <label for="occurDate">발생 날짜</label>
                <input
                    type="date"
                    id="occurDate"
                >
            </div>

            <div class="form-group">
                <label for="startTime">발생 시간</label>
                <input
                    type="time"
                    id="startTime"
                    step="1"
                >
            </div>

            <div class="form-group">
                <label for="endTime">
                    종료 시간
                    <span class="optional-label">선택</span>
                </label>

                <input
                    type="time"
                    id="endTime"
                    step="1"
                >

                <p class="input-help">
                    종료 시간을 모르면 비워둘 수 있습니다.
                </p>
            </div>

            <div class="duration-preview">
                <span>지속시간</span>
                <strong id="durationPreview">미입력</strong>
            </div>

        </section>


        <!-- 발작 유형 -->
        <section class="form-card">

            <div class="form-card-title">
                <h2>발작 유형</h2>
                <span class="required-label">필수</span>
            </div>

            <div
                class="choice-grid"
                id="typeChoices"
            >

                <button
                    type="button"
                    class="choice-button"
                    data-value="전신 경련"
                >
                    전신 경련
                </button>

                <button
                    type="button"
                    class="choice-button"
                    data-value="의식 소실"
                >
                    의식 소실
                </button>

                <button
                    type="button"
                    class="choice-button"
                    data-value="멍함 / 반응 저하"
                >
                    멍함 / 반응 저하
                </button>

                <button
                    type="button"
                    class="choice-button"
                    data-value="부분 경련"
                >
                    부분 경련
                </button>

                <button
                    type="button"
                    class="choice-button"
                    data-value="기타"
                >
                    기타
                </button>

            </div>

        </section>


        <!-- 관찰 사항 -->
        <section class="form-card">

            <div class="form-card-title">
                <h2>관찰 사항</h2>
                <span class="optional-label">선택</span>
            </div>

            <div
                class="choice-grid"
                id="observationChoices"
            >

                <button
                    type="button"
                    class="choice-button"
                    data-value="넘어짐"
                >
                    넘어짐
                </button>

                <button
                    type="button"
                    class="choice-button"
                    data-value="호흡 이상"
                >
                    호흡 이상
                </button>

                <button
                    type="button"
                    class="choice-button"
                    data-value="침 흘림"
                >
                    침 흘림
                </button>

                <button
                    type="button"
                    class="choice-button"
                    data-value="구토"
                >
                    구토
                </button>

                <button
                    type="button"
                    class="choice-button"
                    data-value="특이사항 없음"
                >
                    특이사항 없음
                </button>

            </div>

        </section>


        <!-- 발작 후 상태 -->
        <section class="form-card">

            <div class="form-card-title">
                <h2>발작 후 상태</h2>
                <span class="optional-label">선택</span>
            </div>

            <div
                class="choice-grid"
                id="afterChoices"
            >

                <button
                    type="button"
                    class="choice-button"
                    data-value="바로 회복"
                >
                    바로 회복
                </button>

                <button
                    type="button"
                    class="choice-button"
                    data-value="졸림"
                >
                    졸림
                </button>

                <button
                    type="button"
                    class="choice-button"
                    data-value="혼란"
                >
                    혼란
                </button>

                <button
                    type="button"
                    class="choice-button"
                    data-value="평소와 다름"
                >
                    평소와 다름
                </button>

            </div>

        </section>


        <!-- 메모 -->
        <section class="form-card">

            <div class="form-card-title">
                <h2>메모</h2>
                <span class="optional-label">선택</span>
            </div>

            <textarea
                id="memo"
                rows="4"
                placeholder="기억나는 내용을 간단히 입력하세요."
            ></textarea>

        </section>


        <!-- 저장 -->
        <div class="manual-save-area">

            <button
                type="button"
                id="saveManualButton"
                class="save-button"
            >
                지난 발작 기록 저장
            </button>

        </div>

    </main>

</div>


<script type="module">

import {
    collection,
    addDoc,
    Timestamp
} from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

import { db } from "./js/firebase.js";


let selectedType = "";
let selectedObservations = [];
let selectedAfter = "";


// ----------------------------------------
// 기본 날짜 / 시간
// ----------------------------------------

const now = new Date();

const dateInput = document.getElementById("occurDate");
const startInput = document.getElementById("startTime");
const endInput = document.getElementById("endTime");

dateInput.value = formatDate(now);
startInput.value = formatTime(now);


// ----------------------------------------
// 날짜 / 시간 형식
// ----------------------------------------

function formatDate(date) {

    const year = date.getFullYear();
    const month = String(
        date.getMonth() + 1
    ).padStart(2, "0");

    const day = String(
        date.getDate()
    ).padStart(2, "0");

    return `${year}-${month}-${day}`;
}


function formatTime(date) {

    const hours = String(
        date.getHours()
    ).padStart(2, "0");

    const minutes = String(
        date.getMinutes()
    ).padStart(2, "0");

    const seconds = String(
        date.getSeconds()
    ).padStart(2, "0");

    return `${hours}:${minutes}:${seconds}`;
}


// ----------------------------------------
// 지속시간
// ----------------------------------------

function updateDuration() {

    const date = dateInput.value;
    const start = startInput.value;
    const end = endInput.value;

    const preview =
        document.getElementById(
            "durationPreview"
        );

    if (!date || !start || !end) {

        preview.textContent = "미입력";

        return;
    }

    const startDate =
        new Date(`${date}T${start}`);

    const endDate =
        new Date(`${date}T${end}`);


    // 자정을 넘긴 경우

    if (endDate < startDate) {

        endDate.setDate(
            endDate.getDate() + 1
        );
    }


    const seconds =
        Math.floor(
            (endDate - startDate) / 1000
        );


    if (seconds < 0) {

        preview.textContent = "확인 필요";

        return;
    }


    preview.textContent =
        formatDuration(seconds);
}


function formatDuration(seconds) {

    if (!seconds) {

        return "0초";
    }


    const minutes =
        Math.floor(seconds / 60);

    const remainSeconds =
        seconds % 60;


    if (minutes === 0) {

        return `${remainSeconds}초`;
    }


    if (remainSeconds === 0) {

        return `${minutes}분`;
    }


    return `${minutes}분 ${remainSeconds}초`;
}


dateInput.addEventListener(
    "change",
    updateDuration
);

startInput.addEventListener(
    "change",
    updateDuration
);

endInput.addEventListener(
    "change",
    updateDuration
);


// ----------------------------------------
// 발작 유형
// ----------------------------------------

document
    .querySelectorAll(
        "#typeChoices .choice-button"
    )
    .forEach(button => {

        button.addEventListener(
            "click",
            () => {

                document
                    .querySelectorAll(
                        "#typeChoices .choice-button"
                    )
                    .forEach(item => {

                        item.classList.remove(
                            "selected"
                        );

                    });


                button.classList.add(
                    "selected"
                );

                selectedType =
                    button.dataset.value;

            }
        );

    });


// ----------------------------------------
// 관찰 사항
// ----------------------------------------

document
    .querySelectorAll(
        "#observationChoices .choice-button"
    )
    .forEach(button => {

        button.addEventListener(
            "click",
            () => {

                const value =
                    button.dataset.value;


                if (
                    value ===
                    "특이사항 없음"
                ) {

                    selectedObservations =
                        ["특이사항 없음"];


                    document
                        .querySelectorAll(
                            "#observationChoices .choice-button"
                        )
                        .forEach(item => {

                            item.classList.remove(
                                "selected"
                            );

                        });


                    button.classList.add(
                        "selected"
                    );

                    return;
                }


                selectedObservations =
                    selectedObservations.filter(
                        item =>
                            item !==
                            "특이사항 없음"
                    );


                const index =
                    selectedObservations.indexOf(
                        value
                    );


                if (index >= 0) {

                    selectedObservations.splice(
                        index,
                        1
                    );

                    button.classList.remove(
                        "selected"
                    );

                } else {

                    selectedObservations.push(
                        value
                    );

                    button.classList.add(
                        "selected"
                    );

                }

            }
        );

    });


// ----------------------------------------
// 발작 후 상태
// ----------------------------------------

document
    .querySelectorAll(
        "#afterChoices .choice-button"
    )
    .forEach(button => {

        button.addEventListener(
            "click",
            () => {

                document
                    .querySelectorAll(
                        "#afterChoices .choice-button"
                    )
                    .forEach(item => {

                        item.classList.remove(
                            "selected"
                        );

                    });


                button.classList.add(
                    "selected"
                );

                selectedAfter =
                    button.dataset.value;

            }
        );

    });


// ----------------------------------------
// 저장
// ----------------------------------------

document
    .getElementById(
        "saveManualButton"
    )
    .addEventListener(
        "click",
        async () => {

            const date =
                dateInput.value;

            const start =
                startInput.value;

            const end =
                endInput.value;

            const memo =
                document
                    .getElementById("memo")
                    .value
                    .trim();


            if (!date || !start) {

                alert(
                    "발생 날짜와 시간을 입력해주세요."
                );

                return;
            }


            if (!selectedType) {

                alert(
                    "발작 유형을 선택해주세요."
                );

                return;
            }


            const startedAt =
                new Date(
                    `${date}T${start}`
                );


            let endedAt = null;
            let duration = 0;


            if (end) {

                endedAt =
                    new Date(
                        `${date}T${end}`
                    );


                // 자정을 넘긴 경우

                if (
                    endedAt <
                    startedAt
                ) {

                    endedAt.setDate(
                        endedAt.getDate() + 1
                    );

                }


                duration =
                    Math.floor(
                        (
                            endedAt -
                            startedAt
                        ) / 1000
                    );


                if (duration < 0) {

                    alert(
                        "종료 시간을 확인해주세요."
                    );

                    return;
                }

            }


            const record = {

                startedAt:
                    Timestamp.fromDate(
                        startedAt
                    ),

                endedAt:
                    endedAt
                        ? Timestamp.fromDate(
                            endedAt
                        )
                        : null,

                duration,

                type:
                    selectedType,

                observations:
                    selectedObservations,

                after:
                    selectedAfter,

                memo,

                createdAt:
                    Timestamp.now(),

                recordMethod:
                    "manual"

            };


            const saveButton =
                document.getElementById(
                    "saveManualButton"
                );


            saveButton.disabled = true;

            saveButton.textContent =
                "저장 중...";


            try {

                await addDoc(
                    collection(
                        db,
                        "seizures"
                    ),
                    record
                );


                alert(
                    "발작 기록이 저장되었습니다."
                );


                location.href =
                    "index.html";


            } catch (error) {

                console.error(error);


                alert(
                    "저장하지 못했습니다.\n잠시 후 다시 시도해주세요."
                );


                saveButton.disabled =
                    false;

                saveButton.textContent =
                    "지난 발작 기록 저장";

            }

        }
    );

</script>

</body>
</html>

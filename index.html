<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>증상 기록</title>

    <link rel="stylesheet" href="./css/style.css">

    <style>
        /* 오후 수면 기록 */
        .sleep-record-section {
            margin-top: 16px;
        }

        .sleep-record-card {
            padding: 20px;
        }

        .sleep-record-title {
            margin-bottom: 6px;
        }

        .sleep-record-description {
            margin: 0 0 16px;
            color: #666;
            font-size: 14px;
        }

        /* 수면 선택 토글 */
        .sleep-choice-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0;
            border: 1px solid #ddd;
            border-radius: 12px;
            overflow: hidden;
            background: #f5f5f5;
        }

        .sleep-choice-button {
            border: 0;
            border-radius: 0;
            background: #f5f5f5;
            color: #777;
            padding: 14px 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition:
                background-color 0.15s ease,
                color 0.15s ease;
        }

        .sleep-choice-button + .sleep-choice-button {
            border-left: 1px solid #ddd;
        }

        .sleep-choice-button.selected {
            background: #222;
            color: #fff;
        }

        .sleep-choice-button.selected::before {
            content: "✓ ";
            font-weight: 700;
        }

        .sleep-status {
            margin-top: 10px;
            font-size: 13px;
            color: #777;
            text-align: center;
        }
    </style>
</head>

<body>

<div class="app">

    <!-- 헤더 -->
    <header class="home-header">

        <div>
            <p class="home-label">오늘의 기록</p>
        </div>

        <span
            class="home-date"
            id="todayDate"
        >
            9월 29일
        </span>

    </header>


    <main>

        <!-- 오늘 현황 -->
        <section class="today-card">

            <div class="summary-grid">

                <div class="summary-item">
                    <span>증상</span>
                    <strong id="todayCount">0회</strong>
                </div>

                <div class="summary-item">
                    <span>총 지속시간</span>
                    <strong id="todayTotal">0초</strong>
                </div>

                <div class="summary-item">
                    <span>가장 긴 증상</span>
                    <strong id="todayLongest">0초</strong>
                </div>

            </div>

        </section>


        <!-- 증상 기록 -->
        <section class="record-start-section">

            <div class="record-actions">

                <!-- 지금 바로 기록 -->
                <button
                    type="button"
                    class="record-main-button"
                    onclick="location.href='record.html'"
                >

                    <span class="record-main-icon">
                        +
                    </span>

                    <span class="record-main-text">

                        <strong>
                            증상 기록 시작
                        </strong>

                        <small>
                            지금 증상이 시작되면
                        </small>

                    </span>

                    <span class="record-main-arrow">
                        →
                    </span>

                </button>


                <!-- 지난 증상 수동 입력 -->
                <button
                    type="button"
                    class="manual-record-button"
                    onclick="location.href='manual.html'"
                >

                    <span class="manual-record-icon">
                        ✎
                    </span>

                    <span>

                        <strong>
                            지난 증상 수동 입력
                        </strong>

                        <small>
                            놓친 기록을 직접 입력
                        </small>

                    </span>

                </button>

            </div>

        </section>


        <!-- 오후 수면 기록 -->
        <section class="today-card sleep-record-section">

            <div class="sleep-record-card">

                <h2 class="sleep-record-title">
                    오후 수면 기록
                </h2>

                <p class="sleep-record-description">
                    오늘 점심 식사 후 수면했나요?
                </p>

                <div class="sleep-choice-grid">

                    <button
                        type="button"
                        class="sleep-choice-button"
                        id="sleepYesButton"
                    >
                        수면함
                    </button>

                    <button
                        type="button"
                        class="sleep-choice-button"
                        id="sleepNoButton"
                    >
                        수면하지 않음
                    </button>

                </div>

                <div
                    class="sleep-status"
                    id="sleepStatus"
                >
                    아직 기록하지 않았습니다.
                </div>

            </div>

        </section>


        <!-- 안내 
        <section class="notice">

            <div class="notice-icon">
                i
            </div>

            <div>

                <strong>
                    기록 방법
                </strong>

                <p>
                    증상이 시작되면 기록을 시작하고,
                    종료 후 관찰된 내용을 선택해 주세요.
                    놓친 경우에는 수동으로 입력할 수 있습니다.
                </p>

            </div>

        </section>-->


        <!-- 오늘의 증상 -->
        <section class="recent-section">

            <div class="section-header">

                <div>

                    <span class="section-label">
                        기록 확인
                    </span>

                    <h2>
                        오늘의 증상
                    </h2>

                </div>

                <button
                    type="button"
                    class="report-link"
                    onclick="location.href='report.html'"
                >
                    리포트 →
                </button>

            </div>


            <div id="lastRecord">

                <div class="empty-state">
                    오늘 기록된 증상이 없습니다.
                </div>

            </div>

        </section>


    </main>

</div>


<!-- 상세 / 수정 모달 -->
<div
    id="recordModal"
    class="record-modal"
>

    <div class="record-modal-background"></div>


    <div class="record-modal-content">

        <!-- 모달 헤더 -->
        <div class="record-modal-header">

            <div>

                <span class="modal-label">
                    기록 상세
                </span>

                <h2 id="modalTitle">
                    증상 기록
                </h2>

            </div>

            <button
                type="button"
                id="closeModal"
                class="modal-close"
            >
                ×
            </button>

        </div>


        <!-- 상세 보기 -->
        <div id="modalView">

            <div id="modalBody"></div>


            <div class="modal-actions">

                <button
                    type="button"
                    id="editRecordButton"
                    class="edit-record-button"
                >
                    기록 수정
                </button>

                <button
                    type="button"
                    id="deleteRecordButton"
                    class="delete-record-button"
                >
                    기록 삭제
                </button>

            </div>

        </div>


        <!-- 수정 -->
        <div
            id="modalEdit"
            class="modal-edit"
        >

            <!-- 증상 유형 -->
            <div class="edit-section">

                <h3>증상 유형</h3>

                <div
                    class="edit-choice-grid"
                    id="editTypeChoices"
                >

                    <button
                        type="button"
                        class="edit-choice-button"
                        data-type="전신 경련"
                    >
                        전신 경련
                    </button>

                    <button
                        type="button"
                        class="edit-choice-button"
                        data-type="의식 소실"
                    >
                        의식 소실
                    </button>

                    <button
                        type="button"
                        class="edit-choice-button"
                        data-type="멍함 / 반응 저하"
                    >
                        멍함 / 반응 저하
                    </button>

                    <button
                        type="button"
                        class="edit-choice-button"
                        data-type="부분 경련"
                    >
                        부분 경련
                    </button>

                    <button
                        type="button"
                        class="edit-choice-button"
                        data-type="기타"
                    >
                        기타
                    </button>

                </div>

            </div>


            <!-- 관찰 사항 -->
            <div class="edit-section">

                <h3>관찰 사항</h3>

                <div
                    class="edit-choice-grid"
                    id="editObservationChoices"
                >

                    <button
                        type="button"
                        class="edit-choice-button"
                        data-observation="넘어짐"
                    >
                        넘어짐
                    </button>

                    <button
                        type="button"
                        class="edit-choice-button"
                        data-observation="호흡 이상"
                    >
                        호흡 이상
                    </button>

                    <button
                        type="button"
                        class="edit-choice-button"
                        data-observation="침 흘림"
                    >
                        침 흘림
                    </button>

                    <button
                        type="button"
                        class="edit-choice-button"
                        data-observation="구토"
                    >
                        구토
                    </button>

                    <button
                        type="button"
                        class="edit-choice-button"
                        data-observation="특이사항 없음"
                    >
                        특이사항 없음
                    </button>

                </div>

            </div>


            <!-- 증상 후 상태 -->
            <div class="edit-section">

                <h3>증상 후 상태</h3>

                <div
                    class="edit-choice-grid"
                    id="editAfterChoices"
                >

                    <button
                        type="button"
                        class="edit-choice-button"
                        data-after="바로 회복"
                    >
                        바로 회복
                    </button>

                    <button
                        type="button"
                        class="edit-choice-button"
                        data-after="졸림"
                    >
                        졸림
                    </button>

                    <button
                        type="button"
                        class="edit-choice-button"
                        data-after="혼란"
                    >
                        혼란
                    </button>

                    <button
                        type="button"
                        class="edit-choice-button"
                        data-after="평소와 다름"
                    >
                        평소와 다름
                    </button>

                </div>

            </div>


            <!-- 메모 -->
            <div class="edit-section">

                <h3>메모</h3>

                <textarea
                    id="editMemo"
                    placeholder="추가로 기록할 내용"
                ></textarea>

            </div>


            <!-- 수정 버튼 -->
            <div class="edit-actions">

                <button
                    type="button"
                    id="cancelEditButton"
                    class="cancel-edit-button"
                >
                    취소
                </button>

                <button
                    type="button"
                    id="saveEditButton"
                    class="save-edit-button"
                >
                    수정 저장
                </button>

            </div>

        </div>

    </div>

</div>


<script type="module" src="./js/index.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>발작 리포트</title>

    <link rel="stylesheet" href="./css/style.css">
</head>

<body>

<div class="app">

    <header class="page-header">

        <button
            type="button"
            class="back-button"
            onclick="location.href='index.html'"
        >
            ←
        </button>

        <div>

            <span class="page-header-label">
                기록 분석
            </span>

            <h1>
                발작 리포트
            </h1>

        </div>

    </header>


    <main class="report-page">

        <!-- 월 선택 -->
        <section class="period-selector">

            <button
                type="button"
                id="prevMonth"
            >
                ‹
            </button>

            <strong id="currentMonth">
                2026년 9월
            </strong>

            <button
                type="button"
                id="nextMonth"
            >
                ›
            </button>

        </section>


        <!-- 월간 요약 -->
        <section class="report-section">

            <h2>
                월간 요약
            </h2>


            <div class="report-stats">

                <div class="report-stat">

                    <span>
                        총 발작
                    </span>

                    <strong id="totalCount">
                        0회
                    </strong>

                </div>


                <div class="report-stat">

                    <span>
                        평균 지속시간
                    </span>

                    <strong id="averageDuration">
                        0초
                    </strong>

                </div>


                <div class="report-stat">

                    <span>
                        가장 긴 발작
                    </span>

                    <strong id="longestDuration">
                        0초
                    </strong>

                </div>

            </div>

        </section>


        <!-- 발생 시간 -->
        <section class="report-section">

            <h2>
                발생 시간
            </h2>

            <div id="timeBars"></div>

        </section>


        <!-- 발작 유형 -->
        <section class="report-section">

            <h2>
                발작 유형
            </h2>

            <div id="typeBars"></div>

        </section>


        <!-- 일별 발생 -->
        <section class="report-section">

            <h2>
                일별 발생
            </h2>

            <div
                id="dailyRecords"
                class="daily-chart"
            ></div>

        </section>


        <!-- 상세 기록 -->
        <section
            class="report-section detail-section"
            id="detailSection"
        >

            <button
                type="button"
                class="detail-section-toggle"
                id="detailSectionToggle"
            >

                <h2>
                    상세 기록
                </h2>

                <span id="detailSectionArrow">
                    ↓
                </span>

            </button>


            <div class="detail-records-hidden">

                <div id="detailRecords"></div>

            </div>

        </section>

    </main>

</div>


<script
    type="module"
    src="./js/report.js"
></script>

</body>
</html>

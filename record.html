<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>증상 기록하기</title>

    <link rel="stylesheet" href="./css/style.css">
</head>

<body>

<div class="app">

    <header class="page-header">

        <button
            type="button"
            class="back-button"
            onclick="location.href='index.html'"
        >
            ←
        </button>

        <div>

            <span class="page-header-label">
                기록
            </span>

            <h1>
                증상 기록
            </h1>

        </div>

    </header>


    <main class="record-page">

        <!-- 타이머 -->
        <section class="timer-card">

            <div class="timer-card-label">
                증상 지속시간
            </div>

            <div
                class="main-timer"
                id="timer"
            >
                00:00
            </div>

            <div
                class="timer-status"
                id="timerStatus"
            >
                시작 버튼을 눌러 기록을 시작하세요.
            </div>


            <div class="timer-buttons">

                <button
                    type="button"
                    class="start-button"
                    id="startButton"
                >
                    시작
                </button>

                <button
                    type="button"
                    class="stop-button"
                    id="stopButton"
                    disabled
                >
                    종료
                </button>

            </div>

        </section>


        <!-- 기록 순서 -->
        <div class="record-guide">
            <span>① 시작</span>
            <span>→</span>
            <span>② 종료</span>
            <span>→</span>
            <span>③ 내용 기록</span>
        </div>


        <!-- 증상 유형 -->
        <section class="record-panel">

            <div class="panel-heading">

                <div>
                    <h2>증상 유형</h2>
                    <p>가장 가까운 유형을 선택하세요.</p>
                </div>

                <span class="required-label">
                    필수
                </span>

            </div>


            <div
                class="choice-grid"
                id="typeChoices"
            >

                <button
                    type="button"
                    class="choice-button"
                    data-type="멍함 / 반응 저하"
                >
                    멍함 / 반응 저하
                </button>

                <button
                    type="button"
                    class="choice-button"
                    data-type="경직"
                >
                    경직
                </button>

                <button
                    type="button"
                    class="choice-button"
                    data-type="전신 경련"
                >
                    전신 경련
                </button>

                <button
                    type="button"
                    class="choice-button"
                    data-type="부분 경련"
                >
                    부분 경련
                </button>

                <button
                    type="button"
                    class="choice-button"
                    data-type="근육 움찔거림"
                >
                    근육 움찔거림
                </button>

                <button
                    type="button"
                    class="choice-button"
                    data-type="힘 빠짐"
                >
                    힘 빠짐
                </button>

                <button
                    type="button"
                    class="choice-button"
                    data-type="기타"
                >
                    기타
                </button>

            </div>

        </section>


        <!-- 관찰 사항 -->
        <section class="record-panel">

            <div class="panel-heading">

                <div>
                    <h2>관찰 사항</h2>
                    <p>관찰된 내용을 선택하세요.</p>
                </div>

                <span class="optional-label">
                    선택
                </span>

            </div>


            <div
                class="choice-grid"
                id="observationChoices"
            >

                <button
                    type="button"
                    class="choice-button"
                    data-observation="고개 떨굼"
                >
                    고개 떨굼
                </button>

                <button
                    type="button"
                    class="choice-button"
                    data-observation="갑작스런 발성"
                >
                    갑작스런 발성
                </button>

                <button
                    type="button"
                    class="choice-button"
                    data-observation="갑자기 주저앉음"
                >
                    갑자기 주저앉음
                </button>

                <button
                    type="button"
                    class="choice-button"
                    data-observation="팔다리 떨림"
                >
                    팔다리 떨림
                </button>

                <button
                    type="button"
                    class="choice-button"
                    data-observation="상체 처짐"
                >
                    상체 처짐
                </button>

                <button
                    type="button"
                    class="choice-button"
                    data-observation="호흡 변화"
                >
                    호흡 변화
                </button>

                <button
                    type="button"
                    class="choice-button"
                    data-observation="기타"
                >
                    기타
                </button>

            </div>

        </section>


        <!-- 발생 시점 -->
        <section class="record-panel">

            <div class="panel-heading">

                <div>
                    <h2>발생 시점</h2>
                    <p>증상이 발생한 상황을 선택하세요.</p>
                </div>

                <span class="optional-label">
                    선택
                </span>

            </div>


            <div
                class="choice-grid"
                id="occurrenceChoices"
            >

                <button
                    type="button"
                    class="choice-button"
                    data-occurrence="섭취 중"
                >
                    섭취 중
                </button>

                <button
                    type="button"
                    class="choice-button"
                    data-occurrence="활동 요청 중"
                >
                    활동 요청 중
                </button>

                <button
                    type="button"
                    class="choice-button"
                    data-occurrence="서있는 중"
                >
                    서있는 중
                </button>

                <button
                    type="button"
                    class="choice-button"
                    data-occurrence="보행 중"
                >
                    보행 중
                </button>

                <button
                    type="button"
                    class="choice-button"
                    data-occurrence="휠체어 착석 활동 중"
                >
                    휠체어 착석 활동 중
                </button>

                <button
                    type="button"
                    class="choice-button"
                    data-occurrence="휠체어 이동 중"
                >
                    휠체어 이동 중
                </button>

                <button
                    type="button"
                    class="choice-button"
                    data-occurrence="위생활동 중"
                >
                    위생활동 중
                </button>

                <button
                    type="button"
                    class="choice-button"
                    data-occurrence="전환/대기 중"
                >
                    전환/대기 중
                </button>

                <button
                    type="button"
                    class="choice-button"
                    data-occurrence="외부활동 중"
                >
                    외부활동 중
                </button>

                <button
                    type="button"
                    class="choice-button"
                    data-occurrence="기타"
                >
                    기타
                </button>

            </div>

        </section>


        <!-- 증상 후 상태 -->
        <section class="record-panel">

            <div class="panel-heading">

                <div>
                    <h2>증상 후 상태</h2>
                    <p>증상이 끝난 후 상태를 선택하세요.</p>
                </div>

                <span class="optional-label">
                    선택
                </span>

            </div>


            <div
                class="choice-grid"
                id="afterChoices"
            >

                <button
                    type="button"
                    class="choice-button"
                    data-after="즉시 회복"
                >
                    즉시 회복
                </button>

                <button
                    type="button"
                    class="choice-button"
                    data-after="소리내어 웃음"
                >
                    소리내어 웃음
                </button>

                <button
                    type="button"
                    class="choice-button"
                    data-after="의미없는 말하기"
                >
                    의미없는 말하기
                </button>

                <button
                    type="button"
                    class="choice-button"
                    data-after="침흘림 증가"
                >
                    침흘림 증가
                </button>

                <button
                    type="button"
                    class="choice-button"
                    data-after="배뇨"
                >
                    배뇨
                </button>

                <button
                    type="button"
                    class="choice-button"
                    data-after="졸림"
                >
                    졸림
                </button>

                <button
                    type="button"
                    class="choice-button"
                    data-after="기타"
                >
                    기타
                </button>

            </div>

        </section>


        <!-- 메모 -->
        <section class="record-panel">

            <div class="panel-heading">

                <div>
                    <h2>메모</h2>
                    <p>추가로 기록할 내용이 있으면 입력하세요.</p>
                </div>

                <span class="optional-label">
                    선택
                </span>

            </div>


            <textarea
                id="memo"
                placeholder="추가로 기록할 내용"
            ></textarea>

        </section>


        <!-- 저장 -->
        <section class="save-section">

            <button
                type="button"
                id="saveButton"
                class="save-button"
                disabled
            >
                기록 저장
            </button>

            <p class="save-help">
                증상 종료 후 유형을 선택하면 저장할 수 있습니다.
            </p>

        </section>

    </main>

</div>


<script type="module" src="./js/record.js"></script>

</body>
</html>

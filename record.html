<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>발작 기록하기</title>

    <link rel="stylesheet" href="./css/style.css">
</head>

<body>

<div class="app">

    <header class="page-header">

        <button
            type="button"
            class="back-button"
            onclick="location.href='index.html'"
        >
            ←
        </button>

        <div>

            <span class="page-header-label">
                기록
            </span>

            <h1>
                발작 기록
            </h1>

        </div>

    </header>


    <main class="record-page">

        <!-- 타이머 -->
        <section class="timer-card">

            <div class="timer-card-label">
                발작 지속시간
            </div>

            <div
                class="main-timer"
                id="timer"
            >
                00:00
            </div>

            <div
                class="timer-status"
                id="timerStatus"
            >
                시작 버튼을 눌러 기록을 시작하세요.
            </div>


            <div class="timer-buttons">

                <button
                    type="button"
                    class="start-button"
                    id="startButton"
                >
                    시작
                </button>

                <button
                    type="button"
                    class="stop-button"
                    id="stopButton"
                    disabled
                >
                    종료
                </button>

            </div>

        </section>


        <!-- 기록 순서 -->
        <div class="record-guide">
            <span>① 시작</span>
            <span>→</span>
            <span>② 종료</span>
            <span>→</span>
            <span>③ 내용 기록</span>
        </div>


        <!-- 발작 유형 -->
        <section class="record-panel">

            <div class="panel-heading">

                <div>
                    <h2>발작 유형</h2>
                    <p>가장 가까운 유형을 선택하세요.</p>
                </div>

                <span class="required-label">
                    필수
                </span>

            </div>


            <div
                class="choice-grid"
                id="typeChoices"
            >

                <button
                    type="button"
                    class="choice-button"
                    data-type="전신 경련"
                >
                    전신 경련
                </button>

                <button
                    type="button"
                    class="choice-button"
                    data-type="의식 소실"
                >
                    의식 소실
                </button>

                <button
                    type="button"
                    class="choice-button"
                    data-type="멍함 / 반응 저하"
                >
                    멍함 / 반응 저하
                </button>

                <button
                    type="button"
                    class="choice-button"
                    data-type="부분 경련"
                >
                    부분 경련
                </button>

                <button
                    type="button"
                    class="choice-button"
                    data-type="기타"
                >
                    기타
                </button>

            </div>

        </section>


        <!-- 관찰 사항 -->
        <section class="record-panel">

            <div class="panel-heading">

                <div>
                    <h2>관찰 사항</h2>
                    <p>관찰된 내용을 선택하세요.</p>
                </div>

                <span class="optional-label">
                    선택
                </span>

            </div>


            <div
                class="choice-grid"
                id="observationChoices"
            >

                <button
                    type="button"
                    class="choice-button"
                    data-observation="넘어짐"
                >
                    넘어짐
                </button>

                <button
                    type="button"
                    class="choice-button"
                    data-observation="호흡 이상"
                >
                    호흡 이상
                </button>

                <button
                    type="button"
                    class="choice-button"
                    data-observation="침 흘림"
                >
                    침 흘림
                </button>

                <button
                    type="button"
                    class="choice-button"
                    data-observation="구토"
                >
                    구토
                </button>

                <button
                    type="button"
                    class="choice-button"
                    data-observation="특이사항 없음"
                >
                    특이사항 없음
                </button>

            </div>

        </section>


        <!-- 발작 후 상태 -->
        <section class="record-panel">

            <div class="panel-heading">

                <div>
                    <h2>발작 후 상태</h2>
                    <p>발작이 끝난 후 상태를 선택하세요.</p>
                </div>

                <span class="optional-label">
                    선택
                </span>

            </div>


            <div
                class="choice-grid"
                id="afterChoices"
            >

                <button
                    type="button"
                    class="choice-button"
                    data-after="바로 회복"
                >
                    바로 회복
                </button>

                <button
                    type="button"
                    class="choice-button"
                    data-after="졸림"
                >
                    졸림
                </button>

                <button
                    type="button"
                    class="choice-button"
                    data-after="혼란"
                >
                    혼란
                </button>

                <button
                    type="button"
                    class="choice-button"
                    data-after="평소와 다름"
                >
                    평소와 다름
                </button>

            </div>

        </section>


        <!-- 메모 -->
        <section class="record-panel">

            <div class="panel-heading">

                <div>
                    <h2>메모</h2>
                    <p>추가로 기록할 내용이 있으면 입력하세요.</p>
                </div>

                <span class="optional-label">
                    선택
                </span>

            </div>


            <textarea
                id="memo"
                placeholder="추가로 기록할 내용"
            ></textarea>

        </section>


        <!-- 저장 -->
        <section class="save-section">

            <button
                type="button"
                id="saveButton"
                class="save-button"
                disabled
            >
                기록 저장
            </button>

            <p class="save-help">
                발작 종료 후 유형을 선택하면 저장할 수 있습니다.
            </p>

        </section>

    </main>

</div>


<script type="module" src="./js/record.js"></script>

</body>
</html>
